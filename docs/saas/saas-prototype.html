<style>
:root{--ink:#172c29;--muted:#788781;--brand:#116b51;--soft:#e5f1eb;--line:#e3e8e3;--bg:#f5f6f2;--white:#fff;--orange:#c17b37}*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid #d4af57;outline-offset:3px}button,input,select{border-radius:8px}button{border:1px solid var(--line);background:white;padding:8px 13px;color:var(--ink)}.primary{background:var(--brand);color:white;border-color:var(--brand)}.danger{color:#b74c48}.notice{background:#263c35;color:#e7efe9;padding:9px 28px;font-size:12px;display:flex;justify-content:space-between;gap:15px}.notice a{color:#e7efe9}.topbar{height:75px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px}.logo{font-weight:750;font-size:21px;letter-spacing:-.7px}.logo small{font-size:11px;margin-left:10px;color:var(--muted);font-weight:500;letter-spacing:1px}.mark{display:inline-grid;place-items:center;background:var(--brand);color:white;width:31px;height:31px;margin-right:9px;border-radius:10px}.switch{display:flex;padding:4px;background:var(--bg);border-radius:10px;gap:3px}.switch button{border:0;background:transparent}.switch button.active{background:white;box-shadow:0 2px 6px #18342d12;color:var(--brand);font-weight:650}.identity{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.avatar{width:33px;height:33px;border-radius:50%;background:#e9ede3;color:var(--brand);display:grid;place-items:center}.layout{display:flex;min-height:calc(100vh - 114px)}aside{width:224px;flex-shrink:0;background:#fff;padding:27px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column}.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-size:10px;margin:0 12px 14px}nav button{display:block;width:100%;border:0;text-align:left;background:transparent;padding:12px;margin-bottom:5px;color:#68776e}nav button.active{background:var(--soft);color:var(--brand);font-weight:650}nav span{display:inline-block;width:24px}.sidebar-bottom{margin-top:auto;padding-top:45px}.phase{padding:12px;border:1px dashed var(--line);font-size:12px;color:var(--muted);border-radius:9px}.phase strong{display:block;color:var(--ink);margin-bottom:6px}main{flex:1;min-width:0;padding:34px 40px;max-width:1500px;margin:auto;width:100%;align-self:flex-start}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}h1{font-size:28px;letter-spacing:-1px;line-height:1.3;margin:0 0 8px}h2{font-size:16px;margin:0}h3{margin:0 0 9px;font-size:15px}p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chips{display:flex;gap:8px;margin-bottom:18px;align-items:center}.tag{font-size:11px;padding:4px 8px;border-radius:5px;background:var(--soft);color:var(--brand);white-space:nowrap}.tag.warn{background:#fbefdf;color:#a06a30}.tag.grey{background:#edf0eb;color:#718076}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:25px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:21px}.metric-label{color:var(--muted);font-size:12px}.number{font-size:30px;font-weight:650;letter-spacing:-1px;margin:7px 0}.foot{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-bottom:24px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.bars{height:180px;display:flex;align-items:flex-end;gap:15px;padding:20px 28px 30px}.bar{flex:1;background:#c9ddd1;border-radius:4px 4px 0 0;position:relative;min-height:10px}.bar:nth-last-child(2){background:#116b51}.bar label{position:absolute;bottom:-24px;width:100%;text-align:center;font-size:10px;color:var(--muted)}.rows{padding:6px 21px}.row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:11px;font-weight:550;color:var(--muted);background:#fbfcf9;padding:12px 20px}td{padding:15px 20px;border-top:1px solid var(--line);font-size:13px}td small{display:block;color:var(--muted);font-size:11px}.search{display:flex;gap:10px;align-items:center;padding:16px 20px}.search input{width:280px}input,select{border:1px solid var(--line);padding:9px 11px;background:white;color:var(--ink)}.empty{text-align:center;padding:45px;color:var(--muted)}.tenantbadge{font-size:11px;color:var(--muted);margin:8px 0 0}.progress{height:5px;background:#eef0eb;border-radius:3px;margin-top:8px;overflow:hidden}.progress i{display:block;background:#629f80;height:100%}.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.price{font-size:28px;margin:16px 0}.plan-grid ul{padding-left:18px;line-height:2.3;color:var(--muted)}.hint{padding:15px 18px;border-radius:9px;background:#edf1e8;color:#667263;font-size:12px;margin-top:20px}.storehero{background:#e7ecdf;padding:40px;border-radius:14px;margin:20px 0;display:flex;align-items:center;justify-content:space-between}.storehero h1{font-size:39px;max-width:480px}.heroart{font-size:88px;opacity:.8}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.productart{height:165px;background:#eceee6;border-radius:8px;display:grid;place-items:center;font-size:58px;margin-bottom:15px}.productcard{padding:17px}.productcard .row{padding:10px 0 0;border:0}.cart-line{display:flex;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.cart-line div:first-child{flex:1}.modal-backdrop{position:fixed;inset:0;background:#132e2566;z-index:10;display:grid;place-items:center;padding:20px}dialog{position:fixed;inset:0;margin:auto;max-height:90vh;overflow:auto;width:510px;max-width:calc(100vw - 32px);border:0;border-radius:15px;padding:28px;color:var(--ink);box-shadow:0 20px 90px #172c2929}dialog::backdrop{background:#132e2566}dialog .row{padding:10px 0}form label{display:block;font-size:12px;color:var(--muted);margin:16px 0 6px}form input,form select{width:100%}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#203a30;color:white;padding:12px 22px;border-radius:10px;z-index:30;max-width:90vw;box-shadow:0 5px 20px #0002}.statusline{display:flex;gap:9px;padding:11px 0;align-items:start}.dot{width:8px;height:8px;border-radius:50%;background:#5e9e7a;margin-top:7px;flex-shrink:0}.dot.warn{background:#d79b55}.baseline{font-size:12px;line-height:1.8}.mobilelabel{display:none}@media(max-width:1000px){main{padding:25px}aside{width:185px}.identity{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.notice{padding:9px 12px;display:block}.topbar{height:auto;padding:14px;flex-wrap:wrap}.logo small{display:none}.switch{width:100%}.switch button{flex:1}.layout{display:block}aside{width:100%;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.eyebrow,.sidebar-bottom{display:none}nav{display:flex;overflow:auto}nav button{width:auto;white-space:nowrap;margin:0;padding:10px}main{padding:20px 14px}.pagehead{flex-direction:column}.metrics{gap:9px}.card{padding:16px}.number{font-size:24px}.products,.plan-grid{grid-template-columns:1fr}.storehero{padding:24px}.storehero h1{font-size:28px}.heroart{display:none}.search{flex-wrap:wrap}.search input{width:100%}}
</style>
</head>
<body>
<div class="notice"><span>交互原型 · 本地模拟数据 · 不连接后端，不产生真实支付或发信</span><a href="07-BASELINE-REPORT.md">查看本轮基线报告 ↗</a></div>
<header class="topbar"><div class="logo"><span class="mark">C</span>CommerceOS<small>MEDUSA SaaS / MVP</small></div><div class="switch" aria-label="演示身份切换"><button data-mode="platform" class="active">平台运营</button><button data-mode="merchant">商家工作台</button><button data-mode="store">消费者店面</button></div><div class="identity"><span id="identity"></span><span class="avatar">演</span></div></header>
<div class="layout"><aside><div class="eyebrow" id="navlabel"></div><nav id="nav"></nav><div class="sidebar-bottom"><div class="phase"><strong>第一阶段 · 原生电商 SaaS</strong>AI 运营、Helpdesk、CRM、营销与行为分析全部第二阶段。</div></div></aside><main id="app"></main></div>
<dialog id="modal"></dialog><div id="toast" class="toast" hidden></div>
<script>
const KEY='commerceos-mvp-prototype-v1';
const seed={tenants:[{id:'t_mori',name:'MORI 生活',slug:'mori',status:'active',plan:'试点',quota:30},{id:'t_north',name:'北岸器物',slug:'north',status:'active',plan:'试点',quota:20},{id:'t_slow',name:'慢集',slug:'slow',status:'suspended',plan:'试点',quota:10}],products:[{id:'p1',tenant:'t_mori',name:'轻盈日用帆布包',price:129,stock:32,status:'published',icon:'👜'},{id:'p2',tenant:'t_mori',name:'手作陶瓷马克杯',price:89,stock:18,status:'published',icon:'☕'},{id:'p3',tenant:'t_mori',name:'天然棉麻抱枕',price:159,stock:12,status:'draft',icon:'🛋'},{id:'p4',tenant:'t_north',name:'北岸玻璃花瓶',price:199,stock:25,status:'published',icon:'🏺'},{id:'p5',tenant:'t_north',name:'胡桃木置物托盘',price:229,stock:14,status:'published',icon:'🪵'},{id:'p6',tenant:'t_slow',name:'慢集棉布袋',price:79,stock:8,status:'published',icon:'🛍'}],orders:[{id:'MO-1028',tenant:'t_mori',customer:'陈女士',total:129,status:'paid',items:[{id:'p1',name:'轻盈日用帆布包',price:129,qty:1}]},{id:'MO-1027',tenant:'t_mori',customer:'李先生',total:178,status:'shipped',items:[{id:'p2',name:'手作陶瓷马克杯',price:89,qty:2}]},{id:'NO-2081',tenant:'t_north',customer:'王女士',total:199,status:'paid',items:[{id:'p4',name:'北岸玻璃花瓶',price:199,qty:1}]}]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.tenants)||!Array.isArray(db.products)||!Array.isArray(db.orders))db=structuredClone(seed);
let mode='platform',page='overview',tenantId=db.tenants[0].id,cart={},query='',filter='all',toastTimer;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2}),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('浏览器不支持保存，当前会话仍可使用')}};
const tenant=()=>db.tenants.find(t=>t.id===tenantId),products=()=>db.products.filter(p=>p.tenant===tenantId),orders=()=>db.orders.filter(o=>o.tenant===tenantId);
const status=s=>`<span class="tag ${['suspended','draft'].includes(s)?'warn':''}">${({active:'运行中',suspended:'已暂停',draft:'草稿',published:'已上架',paid:'待发货',shipped:'已发货',refunded:'已退款'})[s]||esc(s)}</span>`;
const navs={platform:[['overview','◈','运营概览'],['tenants','▦','租户管理'],['plans','▤','套餐与配额'],['baseline','◎','基线验证']],merchant:[['overview','◈','店铺概览'],['products','▦','商品管理'],['orders','▤','订单管理'],['settings','⚙','店铺设置']],store:[['catalog','◈','全部商品'],['cart','▧','购物袋']]};
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3200)}
function metric(label,value,foot){return `<div class="card"><div class="metric-label">${label}</div><div class="number">${value}</div><div class="foot">${foot}</div></div>`}
function head(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${action}</div></div>`}
function pick(){return `<label class="foot" for="tenantpick">演示店主 / 店面身份</label> <select id="tenantpick">${db.tenants.map(t=>`<option value="${esc(t.id)}" ${t.id===tenantId?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`}
function tenantTable(list){return `<div class="tablewrap"><table><thead><tr><th>商户</th><th>租户 ID</th><th>商城域名示意</th><th>状态</th><th>套餐</th><th>操作</th></tr></thead><tbody>${list.map(t=>`<tr><td><strong>${esc(t.name)}</strong><small>独立租户 · 演示数据</small></td><td><code>${esc(t.id)}</code></td><td>${esc(t.slug)}.example.test</td><td>${status(t.status)}</td><td>${esc(t.plan)}</td><td><button data-toggle="${esc(t.id)}">${t.status==='active'?'暂停':'恢复'}</button> <button data-enter="${esc(t.id)}">店主演示 ↗</button></td></tr>`).join('')}</tbody></table></div>`}
function platformView(){
if(page==='overview')return head('让每一家店，独立生长。','平台仅展示租户状态与配额；商户业务数据通过独立店主演示身份查看。','<button class="primary" data-newtenant>＋ 创建商户</button>')+`<div class="metrics">${metric('租户总数',db.tenants.length,'本地模拟开通记录')}${metric('运行中的商城',db.tenants.filter(t=>t.status==='active').length,'支持暂停与恢复')}${metric('试点套餐','人工开通','自动订阅收费在第二阶段')}${metric('隔离方案','tenant_id','设计目标，尚未实现')}</div><div class="grid"><div class="panel"><div class="panelhead"><h2>平台开店流程</h2><span class="tag">MVP</span></div><div class="rows">${[['01','验证商户与创建租户','关联店主成员与租户身份'],['02','初始化原生电商模块','店铺、地区、渠道、仓库配置'],['03','配置独立收款与上架','支付账户、商品和订单'],['04','验证后开启商城','负向隔离测试与恢复演练']].map(x=>`<div class="row"><div><strong>${x[0]}　${x[1]}</strong><small>${x[2]}</small></div><span class="tag grey">规划</span></div>`).join('')}</div></div><div class="card"><h2>版本与验证边界</h2><p>MIT 候选：Medusa 2.18.0</p><div class="statusline"><span class="dot"></span><div>历史源码快照<small class="foot">　不覆盖当前 develop checkout</small></div></div><div class="statusline"><span class="dot warn"></span><div>多租户仍需改造<small class="foot">　页面切换不代表后端隔离完成</small></div></div><div class="hint">原生后台、交易与 SaaS 管理为第一阶段；AI 和客户运营不提前实施。</div><button style="margin-top:16px" data-page="baseline">查看验证范围</button></div></div><div class="panel"><div class="panelhead"><h2>商户状态</h2><button data-page="tenants">管理全部 →</button></div>${tenantTable(db.tenants)}</div>`;
if(page==='tenants')return head('租户管理','管理商户开通与运行状态，不默认访问商户业务数据。','<button class="primary" data-newtenant>＋ 创建商户</button>')+`<div class="panel"><div class="search"><input id="search" placeholder="搜索店名、子域名、租户 ID" value="${esc(query)}"><select id="filter"><option value="all">全部状态</option><option value="active" ${filter==='active'?'selected':''}>运行中</option><option value="suspended" ${filter==='suspended'?'selected':''}>已暂停</option></select></div>${tenantTable(db.tenants.filter(t=>(filter==='all'||t.status===filter)&&[t.name,t.slug,t.id].join(' ').toLowerCase().includes(query.toLowerCase())))}</div>`;
if(page==='plans')return head('套餐与配额','首版人工确认套餐开通；本地修改不会产生订阅或扣费。')+`<div class="plan-grid">${db.tenants.map(t=>`<div class="card"><span class="tag">${esc(t.plan)}</span><h2 style="margin-top:12px">${esc(t.name)}</h2><div class="price">${db.products.filter(p=>p.tenant===t.id).length} <span class="foot">/ ${t.quota} 商品</span></div><div class="progress"><i style="width:${Math.min(100,db.products.filter(p=>p.tenant===t.id).length/t.quota*100)}%"></i></div><ul><li>原生商品和订单功能</li><li>店主账号与独立店铺配置</li><li>基础配额与暂停恢复</li></ul><button data-quota="${esc(t.id)}">修改商品配额</button></div>`).join('')}</div><div class="hint">金额计费、自动续费、欠费规则将在第二阶段实施。</div>`;
return head('基线验证','运行证据与产品原型分开评估，未执行的检查不计为通过。')+`<div class="grid"><div class="card baseline"><h2>本轮证据</h2><div id="baseline-summary">候选 commit：1014c0337027a6087410ad3cc1da9a11fd83ca8d<br>版本：2.18.0，源代码根许可证 MIT<br>后端/交易验证结果请查看同目录的基线报告。</div><p>当前 develop 为 2.21.1 open-core，未直接作为完整 MIT 基线。</p><a href="07-BASELINE-REPORT.md">打开详细报告与限制 →</a></div><div class="card"><h2>尚不能据此宣称</h2><div class="rows">${['已完成全库 tenant_id 隔离','已通过真实支付渠道验收','已验证 10 租户生产容量','此 HTML 是已接后端的 SaaS'].map(t=>`<div class="row"><span>${t}</span><span class="tag warn">未证明</span></div>`).join('')}</div><div class="hint">恢复演练、数据库 RLS 机制试验、交易测试等结果分别记录，不能互相替代。</div></div></div>`}
function orderTable(list){return `<div class="tablewrap"><table><thead><tr><th>订单</th><th>客户示例</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(o=>`<tr><td><strong>${esc(o.id)}</strong></td><td>${esc(o.customer)}</td><td>${money(o.total)}</td><td>${status(o.status)}</td><td><button data-order="${esc(o.id)}">查看详情</button></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">暂无订单</div>'}</div>`}
function merchantView(){const t=tenant();
if(page==='overview')return head(esc(t.name)+'，欢迎回来。','当前演示身份为本店店主；这里只加载所选店铺的本地模拟数据。',pick())+`<div class="chips">${status(t.status)}<span class="tag grey">${esc(t.id)}</span><span class="foot">${esc(t.slug)}.example.test</span></div><div class="metrics">${metric('订单收款示意',money(orders().filter(o=>o.status!=='refunded').reduce((a,o)=>a+o.total,0)),'模拟数据，不是实时营收')}${metric('待发货订单',orders().filter(o=>o.status==='paid').length,'点击订单可模拟发货')}${metric('已上架商品',products().filter(p=>p.status==='published').length,'商品按租户 ID 分组')}${metric('库存提醒',products().filter(p=>p.stock<15).length,'仅固定阈值，不是 AI 分析')}</div><div class="grid"><div class="panel"><div class="panelhead"><h2>开店检查清单</h2><span class="tag grey">原生电商适配</span></div><div class="rows">${[['商品上架',products().filter(p=>p.status==='published').length+' 件可售商品','products'],['订单处理',orders().length+' 笔模拟订单','orders'],['店铺配置','查看名称与收款配置状态','settings']].map(x=>`<div class="row"><div><strong>${x[0]}</strong><small>${x[1]}</small></div><button data-page="${x[2]}">打开 →</button></div>`).join('')}</div></div><div class="card"><h2>本店边界</h2><p>真实系统必须从身份解析租户，而不是信任客户端选择器。</p><div class="hint">当前选择器仅用于演示不同店主/店面。原生 Medusa 后台将优先复用；本页是 SaaS 信息架构示意。</div><button style="margin-top:15px" data-store>预览本店商城 ↗</button></div></div><div class="panel"><div class="panelhead"><h2>最近订单</h2></div>${orderTable(orders())}</div>`;
if(page==='products')return head('商品管理','复用商品、价格与库存能力，增加租户归属和访问校验。',pick()+`<button class="primary" data-newproduct>＋ 添加商品</button>`)+`<div class="panel"><div class="search"><input id="search" placeholder="搜索商品名称" value="${esc(query)}"><span class="foot">配额 ${products().length}/${t.quota}</span></div><div class="tablewrap"><table><thead><tr><th>商品</th><th>售价</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody>${products().filter(p=>p.name.includes(query)).map(p=>`<tr><td><strong>${p.icon}　${esc(p.name)}</strong><small>${esc(p.id)} · ${esc(p.tenant)}</small></td><td>${money(p.price)}</td><td>${p.stock}</td><td>${status(p.status)}</td><td><button data-edit="${esc(p.id)}">编辑</button> <button data-publish="${esc(p.id)}">${p.status==='published'?'下架':'上架'}</button></td></tr>`).join('')}</tbody></table></div></div>`;
if(page==='orders')return head('订单管理','支付、发货与退款按钮仅修改原型状态，不请求任何交易服务。',pick())+`<div class="panel"><div class="search"><input id="search" placeholder="搜索订单号或客户" value="${esc(query)}"></div>${orderTable(orders().filter(o=>(o.id+o.customer).includes(query)))}</div>`;
return head('店铺设置','原生配置的租户适配；支付凭据仅在服务端安全管理。',pick())+`<div class="grid"><div class="card"><h2>基本信息</h2><form id="settingsform"><label for="shopname">店铺名称</label><input id="shopname" name="name" value="${esc(t.name)}" required maxlength="40"><label>子域名示意</label><input value="${esc(t.slug)}.example.test" disabled><p class="foot">example.test 是示意域名，不是可访问的生产商城。</p><button class="primary" style="margin-top:20px">保存本地设置</button></form></div><div class="card"><h2>收款与上线状态</h2><div class="row"><span>系统/模拟支付</span><span class="tag grey">原型</span></div><div class="row"><span>外部支付渠道</span><span class="tag warn">待接入验收</span></div><div class="row"><span>租户状态</span>${status(t.status)}</div><div class="hint">不在原型收集密钥。真实系统需逐租户解析 Provider 配置，并验证回调账户归属。</div><button style="margin-top:20px" data-reset>恢复全部原型数据</button></div></div>`}
function storeView(){const t=tenant();const items=products().filter(p=>p.status==='published');const count=Object.values(cart).reduce((a,v)=>a+v,0);
if(page==='cart')return head('购物袋','本地演示结账，不调用支付接口；切换店铺会清空购物袋。',pick())+`<div class="grid"><div class="card">${Object.entries(cart).map(([id,qty])=>{const p=items.find(p=>p.id===id);return p?`<div class="cart-line"><div><strong>${p.icon} ${esc(p.name)}</strong><p>${money(p.price)} × ${qty}</p></div><button data-less="${esc(id)}">−</button><span>${qty}</span><button data-add="${esc(id)}">＋</button><button data-remove="${esc(id)}">移除</button></div>`:''}).join('')||'<div class="empty">购物袋为空，去发现喜欢的商品。</div>'}<button style="margin-top:20px" data-page="catalog">继续购物</button></div><div class="card"><h2>结算摘要</h2><div class="row"><span>商品数量</span><strong>${count}</strong></div><div class="row"><span>运费 / 税费</span><span class="foot">原型按 0 演示</span></div><div class="row"><span>合计</span><strong>${money(Object.entries(cart).reduce((a,[id,q])=>a+(items.find(p=>p.id===id)?.price||0)*q,0))}</strong></div><button class="primary" data-checkout ${count&&t.status==='active'?'':'disabled'}>模拟下单 · 不支付</button><p class="foot">真实系统需要重新验证价格、库存、运费、税费和所属租户。</p></div></div>`;
return head(esc(t.name),'独立店面预览 · 示例商品与模拟库存',pick()+`<button data-page="cart">购物袋 (${count})</button>`)+`${t.status==='suspended'?'<div class="hint">本商城已暂停：可查看演示商品，不能新增结账。</div>':''}<div class="storehero"><div><div class="eyebrow" style="margin:0 0 12px">EVERYDAY, WELL MADE</div><h1>为日常，留一点好物。</h1><p>精选实用与质感，构建自己的品牌商城。</p></div><div class="heroart">🌿</div></div><div class="products">${items.map(p=>`<div class="card productcard"><div class="productart">${p.icon}</div><h3>${esc(p.name)}</h3><span class="foot">库存 ${p.stock} · ${esc(t.name)}</span><div class="row"><strong>${money(p.price)}</strong><button class="primary" data-add="${esc(p.id)}" ${p.stock>0&&t.status==='active'?'':'disabled'}>加入购物袋</button></div></div>`).join('')||'<div class="empty">商家还没有上架商品</div>'}</div>`}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#identity').textContent=mode==='platform'?'平台运营 · 模拟身份':mode==='merchant'?'店主 · 模拟身份':'消费者 · 模拟身份';$('#navlabel').textContent=mode==='platform'?'PLATFORM OPERATIONS':mode==='merchant'?'MERCHANT WORKSPACE':'STOREFRONT';$('#nav').innerHTML=navs[mode].map(([id,icon,name])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${icon}</span>${name}</button>`).join('');$('#app').innerHTML=mode==='platform'?platformView():mode==='merchant'?merchantView():storeView();bind();}
function navigate(p){page=p;query='';filter='all';render()}
function switchMode(m){mode=m;page=m==='store'?'catalog':'overview';query='';filter='all';render()}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal();$('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').close())}
function formModal(title,fields,onSubmit){modal(`<h2>${title}</h2><p>仅保存到此浏览器的原型数据。</p><form id="modalform">${fields}<div class="modalfoot"><button type="button" data-close>取消</button><button class="primary">保存</button></div></form>`);$('#modalform').onsubmit=e=>{e.preventDefault();if(onSubmit(new FormData(e.target))!==false){save();$('#modal').close();render()}}}
function editProduct(id){const p=id?products().find(p=>p.id===id):null;if(id&&!p)return toast('当前店铺没有此商品');if(!p&&products().length>=tenant().quota)return toast('已达到商品配额');formModal(p?'编辑商品':'添加商品',`<label>商品名称</label><input name="name" value="${esc(p?.name||'')}" required maxlength="80"><label>售价（元）</label><input name="price" type="number" min="0.01" step="0.01" value="${p?.price||99}" required><label>库存</label><input name="stock" type="number" min="0" step="1" value="${p?.stock??10}" required>`,f=>{const data={name:String(f.get('name')).trim(),price:Number(f.get('price')),stock:Number(f.get('stock'))};if(!data.name||data.price<=0||!Number.isInteger(data.stock)||data.stock<0)return false;if(p)Object.assign(p,data);else db.products.push({id:'p_'+Date.now(),tenant:tenantId,...data,status:'draft',icon:'📦'});toast('商品已保存到原型')})}
function orderDialog(id){const o=orders().find(o=>o.id===id);if(!o)return toast('当前店铺没有此订单');modal(`<h2>订单 ${esc(o.id)}</h2><p>${esc(tenant().name)} · 当前店主权限示意</p>${o.items.map(p=>`<div class="row"><span>${esc(p.name)} × ${p.qty}</span><strong>${money(p.price*p.qty)}</strong></div>`).join('')}<div class="row"><span>订单金额</span><strong>${money(o.total)}</strong></div><div class="row"><span>状态</span>${status(o.status)}</div><div class="hint">操作只改变本地状态，不产生物流请求或真实退款。</div><div class="modalfoot"><button data-close>关闭</button>${o.status==='paid'?'<button class="primary" id="ship">模拟发货</button>':''}${o.status!=='refunded'?'<button class="danger" id="refund">模拟退款</button>':''}</div>`);if($('#ship'))$('#ship').onclick=()=>{o.status='shipped';save();$('#modal').close();render();toast('已模拟发货')};if($('#refund'))$('#refund').onclick=()=>{if(confirm('仅模拟退款状态，不产生真实资金操作。继续？')){o.status='refunded';save();$('#modal').close();render();toast('已模拟退款')}}}
function add(id){const p=products().find(p=>p.id===id&&p.status==='published');if(!p||tenant().status!=='active')return toast('商品不可购买');if((cart[id]||0)>=p.stock)return toast('超过模拟可用库存');cart[id]=(cart[id]||0)+1;render();toast('已加入本店购物袋')}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelectorAll('[data-newtenant]').forEach(b=>b.onclick=()=>formModal('创建商户',`<label>店铺名称</label><input name="name" required maxlength="40"><label>子域名示意（小写字母、数字或短横线）</label><input name="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" maxlength="40">`,f=>{const slug=String(f.get('slug'));if(db.tenants.some(t=>t.slug===slug)){toast('子域名已使用');return false}db.tenants.push({id:'t_'+Date.now(),name:String(f.get('name')).trim(),slug,status:'active',plan:'试点',quota:20});toast('已创建模拟商户；未部署真实商城')}));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const t=db.tenants.find(t=>t.id===b.dataset.toggle);if(confirm(`仅模拟${t.status==='active'?'暂停':'恢复'}「${t.name}」？`)){t.status=t.status==='active'?'suspended':'active';save();render()}});document.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>{tenantId=b.dataset.enter;cart={};switchMode('merchant');toast('已切换为该店店主演示身份')});document.querySelectorAll('[data-quota]').forEach(b=>b.onclick=()=>{const t=db.tenants.find(t=>t.id===b.dataset.quota);formModal('修改商品配额',`<label>商品数量上限</label><input name="quota" type="number" min="${Math.max(1,db.products.filter(p=>p.tenant===t.id).length)}" step="1" value="${t.quota}" required>`,f=>{t.quota=Number(f.get('quota'));toast('本地配额已更新')})});if($('#tenantpick'))$('#tenantpick').onchange=e=>{tenantId=e.target.value;cart={};query='';render()};if($('#search'))$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#filter'))$('#filter').onchange=e=>{filter=e.target.value;render()};document.querySelectorAll('[data-newproduct]').forEach(b=>b.onclick=()=>editProduct());document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>{const p=products().find(p=>p.id===b.dataset.publish);if(p){p.status=p.status==='published'?'draft':'published';save();render()}});document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>orderDialog(b.dataset.order));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.querySelectorAll('[data-less]').forEach(b=>b.onclick=()=>{if(cart[b.dataset.less]>1)cart[b.dataset.less]--;else delete cart[b.dataset.less];render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];render()});if($('[data-store]'))$('[data-store]').onclick=()=>switchMode('store');if($('#settingsform'))$('#settingsform').onsubmit=e=>{e.preventDefault();tenant().name=new FormData(e.target).get('name').trim();save();render();toast('店铺名称已更新')};if($('[data-reset]'))$('[data-reset]').onclick=()=>{if(confirm('恢复全部模拟商户、商品和订单？')){db=structuredClone(seed);tenantId=db.tenants[0].id;cart={};save();render()}};if($('[data-checkout]'))$('[data-checkout]').onclick=()=>{if(tenant().status!=='active')return toast('商城已暂停');const items=Object.entries(cart).map(([id,qty])=>{const p=products().find(p=>p.id===id&&p.status==='published');if(!p||qty>p.stock)throw new Error('商品或库存变化，请重建购物袋');return {id,name:p.name,price:p.price,qty}});if(!items.length)return;items.forEach(i=>products().find(p=>p.id===i.id).stock-=i.qty);const o={id:'DEMO-'+Date.now().toString().slice(-7),tenant:tenantId,customer:'演示消费者',total:items.reduce((a,i)=>a+i.price*i.qty,0),status:'paid',items};db.orders.unshift(o);cart={};save();render();toast('已生成模拟订单 '+o.id+'；没有真实支付')};}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));render();
</script>
</body></html>
